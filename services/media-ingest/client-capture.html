<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Capture & Upload Demo</title>
  <style>video{max-width:100%;} .controls{margin-top:8px}</style>
</head>
<body>
  <h3>Capture photo / video and upload (demo)</h3>
  <video id="preview" autoplay muted playsinline></video>
  <div class="controls">
    <button id="startCam">Start Camera</button>
    <button id="takePhoto">Take Photo</button>
    <button id="startRec">Start Recording</button>
    <button id="stopRec">Stop Recording</button>
  </div>
  <script>
    const preview = document.getElementById('preview')
    let stream, mediaRecorder, chunks = []

    document.getElementById('startCam').onclick = async () => {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      preview.srcObject = stream
    }

    document.getElementById('takePhoto').onclick = async () => {
      if (!stream) return alert('Start camera first')
      const track = stream.getVideoTracks()[0]
      const imageCapture = new ImageCapture(track)
      const blob = await imageCapture.takePhoto()
      uploadBlob(blob, 'photo.jpg')
    }

    document.getElementById('startRec').onclick = () => {
      if (!stream) return alert('Start camera first')
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus' })
      chunks = []
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data) }
      mediaRecorder.start()
      console.log('Recording started')
    }

    document.getElementById('stopRec').onclick = () => {
      if (!mediaRecorder) return
      mediaRecorder.stop()
      mediaRecorder.onstop = async () => {
        const blob = new Blob(chunks, { type: 'video/webm' })
        uploadBlob(blob, 'capture.webm')
      }
    }

    async function uploadBlob(blob, filename) {
      // Request a short-lived upload URL from the ingest server
      const segment = 'acheme-rural-propers' // change as appropriate for the demo
      const slug = 'demo-slug'
      const body = { segment, slug, filename, contentType: blob.type, sizeBytes: blob.size }
      const res = await fetch('/signed-url', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      const json = await res.json()
      if (!json || !json.uploadUrl) return alert('Failed to obtain upload URL: ' + JSON.stringify(json))

      const uploadUrl = json.uploadUrl

      // Use XHR to track upload progress and PUT the blob to the proxy URL
      const xhr = new XMLHttpRequest()
      xhr.open('PUT', uploadUrl)
      xhr.setRequestHeader('Content-Type', blob.type)
      xhr.upload.onprogress = (ev) => {
        if (ev.lengthComputable) console.log('Upload progress', Math.round((ev.loaded/ev.total)*100) + '%')
      }
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { const r = JSON.parse(xhr.responseText); alert('Upload complete: ' + JSON.stringify(r)) } catch (e) { alert('Upload complete') }
        } else {
          alert('Upload failed: ' + xhr.status + ' ' + xhr.responseText)
        }
      }
      xhr.onerror = () => alert('Upload error')
      xhr.send(blob)
    }
  </script>
</body>
</html>
