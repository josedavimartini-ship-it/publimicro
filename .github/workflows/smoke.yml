name: Playwright Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_URL: ${{ github.event.inputs['preview-url'] || 'http://127.0.0.1:3000' }}
      BYPASS_INPUT: ${{ github.event.inputs['bypass-token'] || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 'latest'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build publimicro
        run: pnpm -w turbo run build --filter=@publimicro/publimicro

      - name: Start publimicro (production)
        run: pnpm -C apps/publimicro start &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:3000 >/dev/null; then
              echo "server ready" && break
            fi
            sleep 2
          done

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Inject bypass secret via local action
        uses: ./.github/actions/inject-bypass




      - name: Run smoke script
        env:
          SAVE_ARTIFACTS: '1'
        run: |
          # Prefer input token; if not set, fall back to VERCEL_PROTECTION_BYPASS set in env by previous step
          VERCEL_PROTECTION_BYPASS="${BYPASS_INPUT:-$VERCEL_PROTECTION_BYPASS}"

          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            echo "Using Vercel bypass token (masked): ${VERCEL_PROTECTION_BYPASS:0:4}...${VERCEL_PROTECTION_BYPASS: -4}"
          fi

          PREVIEW_URL="${PREVIEW_URL:-http://127.0.0.1:3000}"
          node tools/smoke-whatsapp.js "$PREVIEW_URL"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            artifacts/**
            artifacts/smoke-artifacts-batch-c.zip

      - name: Post smoke result comment on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Smoke tests completed — artifacts uploaded to workflow artifacts (smoke-artifacts)." > /tmp/smoke_comment.txt
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/smoke_comment.txt
