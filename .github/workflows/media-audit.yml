name: Media Audit & URL Check

on:
  workflow_dispatch:
    inputs:
      run-type:
        description: 'Type: quick or full'
        required: false
        default: 'full'
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

jobs:
  media-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 'latest'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Failsafe: check for direct `fotos[0]` usages
        run: |
          mkdir -p artifacts
          pnpm run check-fotos-usage || true

      - name: Build monorepo (cold build)
        run: pnpm -w turbo run build --filter=@publimicro/publimicro

      - name: Run SQL audit (service-role required)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          mkdir -p artifacts
          node scripts/audit-supabase-media.mjs --out artifacts/audit.json --fail-on-findings || true
          # Save stdout too
          echo "--- audit stdout ---" > artifacts/audit.stdout.txt || true

      - name: Run DB-mode URL reachability check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p artifacts
          node scripts/check-media-urls.mjs --from-db --out artifacts/check-media.json --concurrency 20

      - name: Run Carcará targeted media audit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p artifacts
          node scripts/check-carcara-media.mjs || true

      - name: Evaluate results and fail on issues
        run: |
          echo 'Checking audit summary and URL checks...'
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('artifacts/audit.json','utf8')); const c=JSON.parse(fs.readFileSync('artifacts/check-media.json','utf8')); const findings=(a.sitios_no_photos.count||0)+(a.sitios_empty_photos.count||0)+(a.listings_missing_cover.count||0)+(a.media_placeholders.count||0); if(findings>0){ console.error('Audit findings > 0:', findings); process.exit(2); } const failed=c.failed||0; if(failed>0){ console.error('Failed URLs > 0:', failed); process.exit(3); } console.log('No findings, all checks passed.')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: media-audit-artifacts
          path: artifacts/**

      - name: Post summary comment (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs['run-type'] == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Media audit completed — artifacts uploaded: media-audit-artifacts" > /tmp/media_audit_comment.txt
          if [ -n "${{ github.event.pull_request }}" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file /tmp/media_audit_comment.txt || true
          fi
